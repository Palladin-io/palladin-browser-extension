name: Design proposal
description: Propose a scoped architecture, documentation, or future implementation change.
title: "[Proposal] "
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: The extension is experimental and deferred. Do not include secrets or production data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Identify affected trust boundaries, data, permissions, hosts, and failure modes.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included credentials, keys, tokens, private endpoints, or production data.
          required: true
