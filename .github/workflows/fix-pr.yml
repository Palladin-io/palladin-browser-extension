name: "Claude Code: Fix PR"

# WARNING: MAINTAINER REVIEW REQUIRED.
# This workflow runs Claude Code with --dangerously-skip-permissions and can push
# commits to a PR branch. It is intentionally workflow_dispatch-only (never
# auto-triggered by PR events) so a maintainer must deliberately invoke it, and it
# is gated to same-repo branches so it never operates on fork PRs. Any commits it
# produces MUST be human-reviewed before merge - treat them as untrusted. The Bash
# allow-list below is deliberately narrowed to the exact subcommands the fix flow
# needs; do not broaden it to Bash(git:*) / Bash(npm:*).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to fix"
        required: true
      user_context:
        description: "Extra instructions (optional)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  CLAUDE_MODEL: claude-opus-4-8

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    name: Claude Code Fix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve PR number and branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          echo "number=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          HEAD=$(gh pr view "$INPUT_PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          # Refuse to operate on a fork PR: the head must exist on this repo.
          if ! gh api "repos/${REPO}/branches/${HEAD}" >/dev/null 2>&1; then
            echo "Refusing to run: branch '$HEAD' is not on ${REPO} (fork PR)." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR review data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr view "$PR" --json number,title,headRefName,baseRefName,author > /tmp/pr_meta.json
          gh pr view "$PR" --json reviews > /tmp/pr_reviews.json
          gh api "repos/${REPO}/pulls/${PR}/comments" > /tmp/pr_inline_comments.json
          gh pr diff "$PR" --name-only > /tmp/pr_files.txt
          gh pr diff "$PR" > /tmp/pr_diff.patch

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Claude Code fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          USER_CONTEXT: ${{ github.event.inputs.user_context }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          npm ci

          {
            echo '# Task: address the review feedback on pull request #'"${PR}"
            echo ''
            echo 'You are fixing a Manifest V3 browser extension for Palladin, a'
            echo 'zero-knowledge password manager. Read AGENTS.md first and honour every'
            echo 'security rule. Never weaken the security model to satisfy a comment.'
            echo ''
            echo '## Pre-fetched PR data'
            echo '- /tmp/pr_meta.json - PR metadata'
            echo '- /tmp/pr_reviews.json - reviews with verdicts'
            echo '- /tmp/pr_inline_comments.json - inline comments to address'
            echo '- /tmp/pr_files.txt - changed files'
            echo '- /tmp/pr_diff.patch - full diff'
            echo ''
            echo '## What to do'
            echo '- Address the actionable review comments with minimal, focused edits.'
            echo '- Keep AGENTS.md and CLAUDE.md byte-for-byte identical (verify with cmp).'
            echo '- Run `npm run build` and `npm test`; both must pass before you commit.'
            echo '- Commit in Polish with a conventional message, then push to the PR'
            echo '  branch. Reply to the comments you addressed.'
            if [ -n "$USER_CONTEXT" ]; then
              echo ''
              echo '## Additional instructions'
              echo ''
              echo "$USER_CONTEXT"
            fi
          } > /tmp/fix_prompt.md

          claude -p \
            --model "$CLAUDE_MODEL" \
            --max-turns 120 \
            --dangerously-skip-permissions \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(jq:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git config:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(npm ci),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*)" \
            < /tmp/fix_prompt.md
