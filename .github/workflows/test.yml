name: Test

# Fork-safe: `pull_request` (never `pull_request_target`) and no secrets are
# used, so this workflow runs safely on pull requests from forks.
on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail the build on any high/critical dependency advisory. Moderate/low
      # are surfaced but non-blocking. Run `npm audit fix` when this trips.
      - name: Audit dependencies (high/critical -> blocking)
        run: npm audit --audit-level=high
      - name: Audit dependencies (report moderate/low)
        run: npm audit || true
      - run: npm run build
      - name: Verify debug Chromium uses the shared native host
        run: npm run build:chromium:debug
      - run: npm test
      - name: Install Chromium for shared-unlock browser checks
        run: npx playwright install --with-deps chromium
      - name: DEBUG repeated matrix
        run: for i in 1 2 3 4 5 6; do node tests/browser/inline-capture-matrix.mjs 2>&1 | grep -E "DBG|PASS|FAIL|Error" | grep -vE "connected .*(chrome-extension)" || true; echo "=== iteration $i done"; done
