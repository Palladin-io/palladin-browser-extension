name: "Claude Code: PR Review"

# Fork-safety: the review job uses a secret (CLAUDE_CODE_OAUTH_TOKEN) and is
# gated to same-repo pull requests. Fork PRs skip the job entirely, so the secret
# is never needed or exposed for untrusted contributors. We use `pull_request`
# (never `pull_request_target`) and include `ready_for_review` so a PR that leaves
# draft state is reviewed.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      user_context:
        description: "Extra instructions for the reviewer"
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  CLAUDE_MODEL: claude-opus-4-8

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo only: never run (and never expose secrets) for fork PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Claude Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_NUMBER_FROM_EVENT: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "number=$PR_NUMBER_FROM_EVENT" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          HEAD=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
          git fetch origin "$HEAD"
          git checkout -B "$HEAD" "origin/$HEAD"

      - name: Fetch PR data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr view "$PR" --json number,title,body,author,additions,deletions,changedFiles,headRefName,baseRefName > /tmp/pr_meta.json
          gh pr diff "$PR" > /tmp/pr_diff.patch
          gh pr view "$PR" --json files --jq '.files[].path' > /tmp/pr_files.txt
          gh pr view "$PR" --json reviews > /tmp/pr_reviews.json
          gh api "repos/${REPO}/pulls/${PR}/comments" > /tmp/pr_inline_comments.json

      - name: Run Claude Code review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          USER_CONTEXT: ${{ github.event.inputs.user_context }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          {
            echo '# Task: review pull request #'"${PR}"
            echo ''
            echo 'You are reviewing a Manifest V3 browser extension for Palladin, a'
            echo 'zero-knowledge password manager. Read AGENTS.md first - it holds the'
            echo 'hard security rules. Treat any security-rule violation as a Critical'
            echo '(blocking) finding.'
            echo ''
            echo '## Pre-fetched PR data (use these files; do not re-run gh to fetch them)'
            echo '- /tmp/pr_meta.json - metadata (jq . /tmp/pr_meta.json)'
            echo '- /tmp/pr_diff.patch - full diff (Read tool)'
            echo '- /tmp/pr_files.txt - changed file paths'
            echo '- /tmp/pr_reviews.json - previous reviews with verdicts (CHECK BEFORE REVIEWING)'
            echo '- /tmp/pr_inline_comments.json - previous inline comments'
            echo ''
            echo '## What to check (highest priority first)'
            echo '- Keys or secrets written to localStorage / sessionStorage / IndexedDB /'
            echo '  chrome.storage.local / chrome.storage.sync, or plaintext cached to disk.'
            echo '- Inline crypto instead of the shared crypto package.'
            echo '- Secrets in logs / analytics / diagnostics.'
            echo '- Bridge messages accepted without full validation (source + origin +'
            echo '  nonce + direction + payload type); payloads widened to unknown/any.'
            echo '- Confirmation/approval UI injected into the page DOM instead of the'
            echo '  native popup or a closed shadow-root.'
            echo '- Missing strict eTLD+1 / HTTPS origin gate before a fill; subdomain'
            echo '  matching by default.'
            echo '- Manifest permission or host_permissions growth without justification.'
            echo '- Correctness bugs, missing tests for new bridge/protocol paths.'
            echo '- Copy using em dash instead of a plain hyphen; all-caps UI text.'
            echo '- AGENTS.md and CLAUDE.md drift (must stay byte-for-byte identical).'
            echo ''
            echo '## How to respond'
            echo 'Post a single PR review via `gh` with a verdict (approve or request'
            echo 'changes) and concise, actionable findings. Reference file:line. Do not'
            echo 'restate the whole diff. Post inline comments for specific lines.'
            if [ -n "$USER_CONTEXT" ]; then
              echo ''
              echo '## Additional instructions'
              echo ''
              echo "$USER_CONTEXT"
            fi
          } > /tmp/review_prompt.md

          claude -p \
            --model "$CLAUDE_MODEL" \
            --max-turns 120 \
            --dangerously-skip-permissions \
            --allowedTools "Bash(gh:*),Bash(jq:*),Read,Glob,Grep" \
            < /tmp/review_prompt.md
