<div id="sign_in_form" role="group" aria-labelledby="contentheader" class="signin-form swp eyebrow has-focus has-password-focus account-name-entered fed-auth show-password">
  <div>
    <div class="signin-content">
      <div class="account-name password-focus show-password">
        <div>
          <div class="form-cell-wrapper form-textbox">
            <input type="text" id="account_name_text_field" enterkeyhint="done" can-field="accountName" aria-labelledby="apple_id_field_label" autocorrect="off" autocapitalize="off" aria-required="true" required="required" spellcheck="false" class="force-ltr form-textbox-input form-textbox-entered" autocomplete="username webauthn" aria-invalid="false">
            <span aria-hidden="true" id="apple_id_field_label" class="form-textbox-label form-label-flyout">Email or Phone Number</span>
          </div>
        </div>
      </div>
      <div class="password show-password show-placeholder password-focus">
        <div>
          <div class="form-cell-wrapper form-textbox">
            <input type="password" id="password_text_field" aria-labelledby="password_field_label" aria-required="true" required="required" can-field="password" class="form-textbox-input form-textbox-entered" autocomplete="current-password" aria-invalid="false">
            <span id="password_field_label" aria-hidden="true" class="form-textbox-label form-label-flyout">Password</span>
          </div>
        </div>
      </div>
      <div class="signin-content__footer signin-content__footer--has-content">
        <div class="signin-content__footer__items">
          <div class="si-remember-password">
            <div class="form-checkbox">
              <input type="checkbox" id="remember-me" class="form-checkbox-input">
              <label id="remember-me-label" for="remember-me" class="form-label tk-body-reduced"><span class="form-checkbox-indicator" aria-hidden="true"></span> Remember me</label>
            </div>
          </div>
          <div class="tk-body-reduced signin-content__footer__items__right">
            <div class="si-forgot-password"><a id="iforgot-link" class="si-link ax-outline lite-theme-override" href="https://iforgot.apple.com/password/verify/appleid" target="_blank">Forgot password?</a></div>
          </div>
        </div>
      </div>
    </div>
    <div class="signin-v2__buttons-wrapper">
      <div class="signin-v2__buttons-wrapper__button-wrapper">
        <div>
          <button id="sign-in" class="tk-subbody button button-rounded-rectangle signin-v2__buttons-wrapper__button-wrapper__button">
            <span class="signin-v2__buttons-wrapper__button-wrapper__button__text">Sign In</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
