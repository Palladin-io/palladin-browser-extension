							<span data-form-specimen-node="4">Log in by email or phone</span>
						</label>
						<select name="domain" data-form-specimen-node="5">
							
							<option selected="selected" data-form-specimen-node="6">@seznam.cz</option>

					<label class="magic password errorable" hidden="" data-form-specimen-node="12">

					<svg class="icon icon-eye" data-form-specimen-node="15"><path data-form-specimen-node="16"></path></svg></label>
