<form id="registration-form" data-form-specimen-node="0">

    

    <div class="fc-field fc-required" data-form-specimen-node="1">

    </div>

    <div class="hideAnimate hidden" data-form-specimen-node="7">

    </div>

    <div class="fc-field fc-required showAnimate active" data-form-specimen-node="11">

                    <div class="section-row" data-form-specimen-node="15">
        <label class="base-input fc-field" data-form-specimen-node="16">            <span class="fc-label caps-none sans-bold fs-s mb-s fc-required" data-form-specimen-node="17"></span>
<input type="password" id="plainPassword" name="plainPassword" required="required" autocomplete="new-password" placeholder="Zadajte vaše heslo" class="mb-m field" data-form-specimen-node="18"></label></div>
    </div>
<ul class="password-checks showAnimate fs-s active" data-form-specimen-node="19">

    <li class="flex mb-xs" id="passwordNumber" data-form-specimen-node="23"><svg class="svg-icon mr-s" data-form-specimen-node="24"><use data-form-specimen-node="25"></use></svg>Číslica</li>
    <li class="flex mb-xs" id="passwordUppercase" data-form-specimen-node="26"><svg class="svg-icon mr-s" data-form-specimen-node="27"><use data-form-specimen-node="28"></use></svg>Veľké písmeno</li>
    <li class="flex mb-xs" id="passwordLowercase" data-form-specimen-node="29"><svg class="svg-icon mr-s" data-form-specimen-node="30"><use data-form-specimen-node="31"></use></svg>Malé písmeno</li>
</ul>

<div class="mt-m mb-l showAnimate fs-s active" data-form-specimen-node="32">
    <p id="js-pwd-strength-warning" data-form-specimen-node="33">Najmenej 5 znakov musí byť jedinečných.</p>
    <p id="js-pwd-strength-suggestion" class="mt-xs" data-form-specimen-node="34">Tip: Použite v hesle niekoľko slov, vyhnite sa bežným frázam.<br data-form-specimen-node="35"></p>
</div>

    <div class="cf" data-form-specimen-node="36">
        <button type="submit" disabled="" class="btn btn-l wf" data-form-specimen-node="37">Zaregistrovať sa</button>

    <div class="mt-l align-center" data-form-specimen-node="38">
        <a data-form-specimen-node="39">Zásady ochrany osobných údajov</a>
