<form id="loginForm" data-form-specimen-node="0">
    <div class="formCol" data-form-specimen-node="1">
		<h4 data-form-specimen-node="2">Zaloguj się używając swojego konta:</h4>	
		<fieldset data-form-specimen-node="3">
			<label for="login_email" data-form-specimen-node="4">Login lub e-mail:</label>
			<input id="login_email" type="text" name="login_email" minlength="3" maxlength="254" class="text" data-form-specimen-node="5">
		</fieldset>
		<fieldset data-form-specimen-node="6">
			<label for="password" data-form-specimen-node="7">Hasło:</label>
			<input id="password" type="password" name="password" minlength="6" maxlength="100" class="password" data-form-specimen-node="8">
		</fieldset>
		<fieldset class="checkbox" data-form-specimen-node="9">
			<div class="checker" data-form-specimen-node="10"><span data-form-specimen-node="11"><input type="checkbox" name="remember_me" data-form-specimen-node="12"></span></div>
			<label data-form-specimen-node="13">Zapamiętaj mnie</label>			
		</fieldset>
		<fieldset data-form-specimen-node="14">
			<input type="submit" id="loginSubmit" value="Zaloguj się" data-form-specimen-node="15">
			<a class="more-link" data-form-specimen-node="16">Nie pamiętam hasła lub loginu <span class="icon" data-form-specimen-node="17"></span></a>
		</fieldset>
    </div>

    <div class="formRow" data-form-specimen-node="18">
        <p data-form-specimen-node="19"><strong data-form-specimen-node="20">Nie masz jeszcze konta?</strong> Załóż je za darmo! Przejdź na <a class="more-link" data-form-specimen-node="21"><strong data-form-specimen-node="22">stronę rejestracji</strong> <span class="icon" data-form-specimen-node="23"></span></a></p>
    </div>
</form>
