<form id="form" data-form-specimen-node="0">
                <input type="hidden" name="action" data-form-specimen-node="1">
                <input type="hidden" name="ref" data-form-specimen-node="2">
    
                    
                <p class="form__account-not-active error--header hide" data-form-specimen-node="3">
                    Konto nie zostało aktywowane. Wysłaliśmy ponownie wiadomość z linkiem aktywacyjnym na podany w rejestracji adres e-mail.
                </p>
    
    
                <div class="js-validation form__item" data-form-specimen-node="4">
                    <div class="form__item-container" data-form-specimen-node="5">
                        <input autocomplete="off" id="email" tabindex="3" type="email" placeholder=" " class="form__input js-toValid js-unvalidated form__input--error" name="email" data-form-specimen-node="6">
                        <label for="email" class="form__label form__label--login labelFocused labelError" data-form-specimen-node="7">E-mail</label>
                        <i class="form__item-icon" data-form-specimen-node="8">
    <img class="" data-form-specimen-node="9">
</i>
                    </div>

                    <p class="error errorRequired" data-form-specimen-node="10">Uzupełnij e-mail</p>
                    <p class="error errorAllowSign hide" data-form-specimen-node="11">Wpisano niepoprawny e-mail</p>
                                    </div>
    
    
                <div class="js-validation form__item" data-form-specimen-node="12">
                    <div class="form__item-container" data-form-specimen-node="13">
                        <input autocomplete="off" id="password" tabindex="4" type="password" placeholder=" " class="form__input js-toValid js-password js-unvalidated form__input--focus" name="password" data-form-specimen-node="14">
                        <label for="password" class="form__label form__label--login labelFocused" data-form-specimen-node="15">Hasło</label>
                        <i class="form__item-icon" data-form-specimen-node="16">
    <img class="" data-form-specimen-node="17">
</i>

                        <div class="form__show-password opacity" data-form-specimen-node="18">
                            <img class="form__show-icon showPass" data-form-specimen-node="19">
                            <img class="form__show-icon hidePass hide" data-form-specimen-node="20">
                        </div>
                    </div>

                    <div class="error errorRequired hide" data-form-specimen-node="21">Uzupełnij hasło</div>
                                    </div>
    
                
    
                
                <div class="form__captcha form__captcha--registration" data-form-specimen-node="22">
                    <div id="recaptcha" class="g-recaptcha" data-form-specimen-node="23"><div data-form-specimen-node="24"><div data-form-specimen-node="25"></div><textarea id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" data-form-specimen-node="26"></textarea></div></div>
                                    </div>
    
    
                <button type="submit" class="form__btn form__btn--login" tabindex="6" data-form-specimen-node="27">
                    <span class="form__btn-text" data-form-specimen-node="28">Dalej</span>
                </button>

                <div class="form__forget-pass" data-form-specimen-node="29">
                    <a tabindex="5" class="js-open-modal" data-form-specimen-node="30">Zapomniałem hasła</a>
                </div>
            </form>
