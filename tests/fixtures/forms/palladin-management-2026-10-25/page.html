<main class="app-shell" data-palladin-ignore="true">
  <div class="detail-card">
    <div class="credential-fields">
      <div class="field">
        <label for="entry-detail-username">Login</label>
        <div class="relative"><input id="entry-detail-username" type="text"></div>
      </div>
      <div class="field">
        <label for="entry-detail-password">Hasło</label>
        <div class="relative">
          <input id="entry-detail-password" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" data-form-type="other" class="ph-no-capture secret-mask">
          <div class="actions"><button type="button" aria-label="Pokaż hasło">Pokaż</button></div>
        </div>
      </div>
    </div>
  </div>
</main>
